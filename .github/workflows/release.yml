# Automated npm publish (Audit 2026-06-02 F3 / D6-H3).
#
# Before this, `npm publish` was a fully manual step from a developer box —
# no guarantee the published tarball matched a clean, tested tree, and no
# provenance. This workflow makes a release reproducible and attestable:
# it triggers on a version tag, re-runs the full quality gate from a clean
# checkout, refuses to publish if the tag doesn't match package.json, and
# publishes with npm provenance.
#
# Authentication is moving from a stored token to npm trusted publishing
# (OIDC), because a stored token is a credential that can leak and that expires
# — the current one expires around 2026-08-31. With trusted publishing there is
# no secret at all: npm verifies the OIDC token GitHub mints for this workflow.
#
# One-time setup (repo owner, web UI only — it cannot be scripted):
#   npmjs.com → the pixelcheck package → Settings → Trusted publisher
#     Organization or user: xcodethink
#     Repository:           pixelcheck
#     Workflow filename:    release.yml     (filename, not a path)
#     Environment:          (leave empty)
#   npm does not validate these on save, so a typo only shows up as a failed
#   publish. The names above must match this file exactly.
#
# Until that is configured, NODE_AUTH_TOKEN below keeps the pipeline working:
# the npm CLI prefers OIDC when it is available and falls back to the token
# otherwise. Once a release has published via OIDC, the token and its secret
# can be deleted — tracked as a follow-up rather than done blind here, because
# removing the fallback before OIDC is proven would break the next release.
#
# Cutting a release:
#   npm version <patch|minor|major>   # bumps package.json + creates the tag
#   git push --follow-tags            # pushes the commit + vX.Y.Z tag → this runs

name: Release

on:
  push:
    tags:
      - "v*.*.*"

# Least privilege: read the repo, and mint an OIDC token so `npm publish
# --provenance` can attest the build. No write scope on repo contents.
permissions:
  contents: read
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          # Trusted publishing needs Node >= 22.14. This is the publishing
          # runtime only — `engines.node` still declares >= 20 and CI still
          # tests 20 and 22, so this does not narrow what consumers can run.
          node-version: 22
          cache: npm
          registry-url: "https://registry.npmjs.org"

      - name: Upgrade npm for trusted publishing
        # Node 22 bundles npm 10.9.x; OIDC publishing needs >= 11.5.1, so the
        # bundled version is not enough and pinning the floor is not optional.
        run: |
          npm install -g npm@^11.5.1
          npm --version

      - name: npm ci
        run: npm ci

      - name: Verify tag matches package.json version
        # Guard against a mistyped or stale tag publishing the wrong version.
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::Tag v$TAG does not match package.json version $PKG"
            exit 1
          fi
          echo "Releasing version $PKG"

      - name: Build
        run: npm run build

      - name: Quality gate (lint + tests + coverage floor)
        run: |
          npm run lint
          npm run test:coverage:check

      - name: Schemas idempotence
        shell: bash
        run: |
          npm run schemas
          if ! git diff --quiet docs/schemas/; then
            echo "::error::npm run schemas produced uncommitted changes — regenerate and commit before tagging."
            git diff docs/schemas/
            exit 1
          fi

      - name: Publish (with provenance)
        # publishConfig.access is already "public". Provenance is generated
        # automatically under trusted publishing; --provenance stays so the
        # attestation is still produced on the token fallback path.
        #
        # NODE_AUTH_TOKEN is the fallback described at the top of this file.
        # Remove it, and the repository secret, once a release has published
        # via OIDC.
        run: npm publish --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
