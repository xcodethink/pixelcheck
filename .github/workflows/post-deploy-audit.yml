name: Post-Deploy AI Audit

# Trigger this workflow after a successful deployment to production.
# Either via workflow_run from the deploy workflow, or manually.

on:
  workflow_dispatch:
    inputs:
      scenarios:
        description: "Comma-separated scenario IDs (empty = all)"
        required: false
        default: ""
      personas:
        description: "Comma-separated persona IDs (empty = all)"
        required: false
        default: ""
      budget:
        description: "Max USD budget for this run"
        required: false
        default: "3.0"
  workflow_run:
    workflows: ["Deploy ScamLens"]
    types: [completed]
    branches: [main]

jobs:
  audit:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install stealth-core
        working-directory: ../stealth-core
        run: |
          npm ci
          npm run build
        # NOTE: in a monorepo this works directly. For separate repos, replace
        # with `npm install <published-version>` or a git submodule.

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Build
        run: npm run build

      - name: Run audit
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SCAMLENS_ADMIN_COOKIE: ${{ secrets.SCAMLENS_ADMIN_COOKIE }}
          STRIPE_TEST_PUBLISHABLE_KEY: ${{ secrets.STRIPE_TEST_PUBLISHABLE_KEY }}
          STRIPE_TEST_CARD_NUMBER: "4242424242424242"
          STRIPE_TEST_CARD_EXP: "12/30"
          STRIPE_TEST_CARD_CVC: "123"
          TEST_GOOGLE_US: ${{ secrets.TEST_GOOGLE_US }}
          TEST_GOOGLE_US_PASSWORD: ${{ secrets.TEST_GOOGLE_US_PASSWORD }}
          TEST_GOOGLE_JP: ${{ secrets.TEST_GOOGLE_JP }}
          TEST_GOOGLE_JP_PASSWORD: ${{ secrets.TEST_GOOGLE_JP_PASSWORD }}
          SLACK_WEBHOOK: ${{ secrets.AUDIT_SLACK_WEBHOOK }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          ARGS="--tag ci-${{ github.run_id }} --budget ${{ github.event.inputs.budget || '3.0' }}"
          if [ -n "${{ github.event.inputs.scenarios }}" ]; then
            for s in $(echo "${{ github.event.inputs.scenarios }}" | tr ',' ' '); do
              ARGS="$ARGS --scenario $s"
            done
          fi
          if [ -n "${{ github.event.inputs.personas }}" ]; then
            for p in $(echo "${{ github.event.inputs.personas }}" | tr ',' ' '); do
              ARGS="$ARGS --persona $p"
            done
          fi
          npx ai-audit run $ARGS

      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audit-report-${{ github.run_id }}
          path: reports/
          retention-days: 30

      - name: Upload baselines (only on main)
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: visual-baselines
          path: baselines/
          retention-days: 90

      - name: Comment on PR (if applicable)
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const reports = fs.readdirSync('reports').filter(d => fs.statSync(path.join('reports', d)).isDirectory());
            const latest = reports[reports.length - 1];
            if (!latest) return;
            const audit = JSON.parse(fs.readFileSync(`reports/${latest}/audit.json`, 'utf8'));
            const s = audit.summary;
            const body = `### AI Browser Audit Result\n\n| Status | Count |\n|---|---|\n| Pass | ${s.pass} |\n| Warn | ${s.pass_with_issues} |\n| Fail | ${s.fail} |\n| Critical Issues | ${s.critical_issues} |\n| Cost | $${s.total_cost_usd.toFixed(3)} |\n\nFull report uploaded as artifact \`audit-report-${{ github.run_id }}\`.`;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });
