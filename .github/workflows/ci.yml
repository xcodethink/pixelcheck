# Continuous Integration — runs on every PR + push to main.
#
# Matrix: 4 platforms × 2 Node versions = 8 configurations.
# Steps: clean install → build → unit tests → schemas idempotence
#        → npm audit (production, level=moderate).
#
# Why this exists:
# Pre-T26 the project had ZERO CI workflows running its own tests —
# `npm test` was only ever validated locally on the maintainer's
# M-series Mac. Any cross-platform regression (Windows path separator,
# Linux glibc version, Node 20 vs 22 difference, native binary mismatch
# on macOS Intel vs arm64) would slip through until a user reported it.
# This workflow makes "full suite green" a CI gate, not a dev claim.
#
# Branch protection requires nine checks: both Node versions on
# ubuntu-latest, macos-14 and macos-15-intel, plus the Playwright
# integration run, the coverage gate and dogfood. That set is chosen to
# match what package.json claims to support rather than gating only the
# cheapest platform — see CONTRIBUTING.md "Required checks" for why
# Windows is deliberately excluded.
#
# Cost: within the free GitHub Actions tier, which is unmetered for public
# repositories.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    # No `branches:` filter — every PR (including stacked PRs whose base
    # is another feature branch) gets a CI matrix run. The earlier
    # `branches: [main]` filter caused stacked-PR chains (e.g. ADR-034's
    # 5-PR Phase 0 sequence) to ship with only the dogfood smoke test
    # passing, masking platform-specific regressions until the chain
    # eventually rebased onto main.

# Cancel in-flight runs on the same ref to avoid wasting compute when
# a PR is rapidly updated.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.os }} · Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    # Windows runs non-blocking. `package.json` lists win32 in `os`, so this is
    # a support claim backed by a gate that cannot fail — the one gap between
    # what this package promises and what CI enforces. It is kept here with an
    # explicit exit condition rather than left open-ended.
    #
    # The reason recorded here until 2026-07-31 was cross-process races in
    # mcp-stdio-e2e and mcp-concurrency-e2e. That was measured and found to be
    # out of date. Across the 40 most recent CI runs, every Windows failure was
    # one of:
    #
    #   12x  Test timed out in 5000ms
    #    8x  EPERM during npm cleanup (install layer, co-occurring with below)
    #    2x  "Could not find any Visual Studio installation to use"
    #
    # Not one was a cross-process race. The third is gone: better-sqlite3
    # stopped shipping Node 20 binaries at 12.10.0, so installs fell back to
    # compiling from source and Windows has no MSVC; the `~12.9.0` pin closed
    # it. The first is addressed in vitest.config.ts, which now sets timeouts
    # for the slowest supported environment instead of a maintainer's machine —
    # the tests hitting the limit take 57ms locally.
    #
    # Exit condition, so this does not become permanent by default: once
    # Windows has been green for 20 consecutive runs on main with those two
    # changes in place, delete this line and add both Windows jobs to branch
    # protection. Until then the flag stays, because a required check that
    # flakes trains people to re-run rather than to read.
    continue-on-error: ${{ matrix.os == 'windows-latest' }}
    strategy:
      # Don't fail the entire matrix when one config fails — surface ALL
      # platform issues, not just the first.
      fail-fast: false
      matrix:
        # macos-14      = Apple Silicon arm64
        # macos-15-intel = Intel x64
        #
        # Both architectures matter here because better-sqlite3 and sharp ship
        # distinct prebuilt binaries per arch, so an arm64-only matrix cannot
        # catch a native-module regression on Intel.
        #
        # History: the matrix used macos-13 for Intel until 2026-07-26, when it
        # was removed because those jobs sat in `queued` indefinitely and three
        # PRs merged with two permanently pending checks — which trains people
        # to ignore a non-green check list. The cause turned out to be that
        # GitHub retired the macos-13 image on 2025-12-04, not anything about
        # this repository. macos-15-intel is the supported replacement and is
        # free on public repositories.
        #
        # Deadline worth knowing: macos-15-intel is the last x86_64 image
        # GitHub will offer, and it goes away in August 2027. After that,
        # darwin-x64 has no CI coverage anywhere and this matrix entry must be
        # removed again — deliberately, not by surprise.
        os: [ubuntu-latest, macos-15-intel, macos-14, windows-latest]
        # Node 18 dropped from CI: vitest 4 (via rolldown) imports
        # `util.styleText` which is Node 20+. Node 18 hit EOL 2025-04.
        # `package.json` engines now declares `>=20` to match (F4-F7 audit
        # follow-up): claiming `>=18` was false since the toolchain never
        # ran there. npm treats engines as a warning by default, so this
        # corrects the claim without hard-breaking any install.
        # Node 20 reached end-of-life on 2026-04-30 and was dropped in v2.0.0;
        # engines.node declares >=22.0.0 and doctor's floor is pinned to it by
        # tests/doctor-node-floor.test.ts.
        #
        # Four steps below run once per push rather than once per cell, and
        # they say so by naming the lowest version in this list: lint,
        # license:check, check:vendor-integrity and check:vendor-drift. Change
        # this list without re-anchoring them and all four stop running, with
        # nothing failing to say so.
        node: [22, 24]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node ${{ matrix.node }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: npm ci
        run: npm ci

      - name: Build
        run: npm run build

      - name: Lint (eslint)
        # ESLint was configured but never enforced in CI.
        # Run once on Ubuntu x Node 20 — lint results are platform-independent.
        # Fails on errors; the no-console policy allows the CLI output layer.
        if: matrix.os == 'ubuntu-latest' && matrix.node == 22
        run: npm run lint

      - name: Unit tests (vitest)
        run: npm test

      - name: Schemas idempotence
        # `npm run schemas` regenerates docs/schemas/*.json from the
        # Zod source. If running it produces uncommitted changes,
        # someone forgot to commit a regeneration after editing a
        # schema source — fail loudly instead of silently shipping
        # diff between source code and published JSON Schemas.
        shell: bash
        run: |
          npm run schemas
          if ! git diff --quiet docs/schemas/; then
            echo "::error::npm run schemas produced uncommitted changes."
            echo "::error::Run \`npm run schemas\` locally and commit the regenerated docs/schemas/*.json"
            git diff docs/schemas/
            exit 1
          fi

      - name: npm audit (production, moderate+)
        # ADR-029 (Stagehand v3 migration) closed the 3 v1.0 transitive
        # moderate waivers. Stagehand v3.3.0 introduced 5 new transitive
        # moderate findings (langsmith / uuid family); we resolve them
        # via `package.json#overrides` (`langsmith ^0.6.0`, `uuid
        # ^14.0.0`) — verified by the Stagehand smoke test at runtime. Result:
        # `npm audit --production` reports 0 MODERATE-or-higher findings, so
        # this gate runs at `--audit-level=moderate` (not `high`).
        #
        # NOTE: there ARE 17 LOW advisories in the production tree (all one
        # root cause: @ai-sdk/provider-utils "Uncontrolled Resource
        # Consumption", fanned out across the @ai-sdk/* + `ai` packages).
        # They are below this gate by design and tracked in SECURITY.md
        # ("Known Advisories"). The dev tree additionally has 1 moderate
        # (brace-expansion) that is NOT in --production and not shipped.
        run: npm audit --production --audit-level=moderate

      - name: License compliance (allowlist)
        # Run only on Ubuntu × Node 20 — license metadata is the same
        # across platforms; running on every matrix config is wasteful.
        # Allowlist + rationale lives in
        # docs/THIRD_PARTY_LICENSES.md.
        if: matrix.os == 'ubuntu-latest' && matrix.node == 22
        run: npm run license:check

      - name: Vendor integrity check (stealth-core)
        # Enforceable on EVERY runner: recomputes the SHA-256 of each
        # vendored stealth-core file and compares against the committed
        # manifest (src/vendor/stealth-core/integrity.json). Needs no
        # upstream source, so unlike the drift check below it is never a
        # no-op — it catches in-place edits, corruption, or added/removed
        # vendored files. See ADR-032 + src/vendor/stealth-core/PROVENANCE.md (F4).
        if: matrix.os == 'ubuntu-latest' && matrix.node == 22
        run: npm run check:vendor-integrity

      - name: Vendor drift check (stealth-core)
        # GitHub-hosted runners don't have an upstream stealth-core source
        # tree available, so AUDIT_VENDOR_DRIFT_SKIP_IF_MISSING=1 turns
        # the check into a no-op when the canonical tree is absent. The
        # check still catches drift in any environment where the canonical
        # IS present (maintainer machines, dedicated runners, etc.).
        # Integrity (above) is the enforceable runner gate; this is the
        # canonical-equivalence gate for environments that have upstream.
        # See ADR-032 for the vendor model and intended drift workflow.
        if: matrix.os == 'ubuntu-latest' && matrix.node == 22
        env:
          AUDIT_VENDOR_DRIFT_SKIP_IF_MISSING: "1"
        run: npm run check:vendor-drift
