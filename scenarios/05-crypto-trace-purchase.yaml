id: 05-crypto-trace-purchase
name: Crypto Trace Discovery + Pricing Surface
priority: P1
goal: |
  Walk a user through discovering ScamLens' paid Crypto Trace feature.
  Verifies the free check-crypto entry point, the upsell to the paid
  Crypto Trace tier, and the pricing page presentation. Does NOT actually
  submit a Stripe purchase — that requires real test card credentials and
  is out of scope for an unattended audit. The Stripe element render and
  three-tier display are still verified.

applies_to:
  personas:
    - us-english-free-mobile
    - jp-japanese-pro-desktop
    - de-german-power-tablet

scoring_dimensions:
  - completion
  - payment_flow_clarity
  - localization
  - trust_signals
  - visual_polish
  - time_to_value

steps:
  - id: open-check-crypto
    type: visit
    url: https://scamlens.org/${persona.url_locale}/check-crypto
    wait_until: domcontentloaded

  - id: rate-free-tool
    type: assert_visual
    instruction: |
      Rate the free check-crypto tool landing page. Verify:
      - Address input is visible above the fold
      - Persona language is consistent (no English mixin)
      - The free vs paid (Crypto Trace) value differentiation is clear
      - Sample report or demo result is shown

  - id: open-pricing
    type: visit
    url: https://scamlens.org/${persona.url_locale}/pricing
    wait_until: domcontentloaded

  - id: rate-pricing
    type: assert_visual
    critical_review: true
    dimensions:
      - visual_polish
      - payment_flow_clarity
      - trust_signals
      - localization
    instruction: |
      Rate the pricing page like a senior PM benchmarking against Stripe and
      Linear. Check:
      - Tiers are clearly differentiated and value-stacked
      - Localized pricing (currency in local format, not raw USD for non-US personas)
      - Trust signals (refund policy, security badges, customer logos)
      - All copy in ${persona.language} including FAQ accordion and feature bullets
      - CTA buttons obvious, language-consistent, and not overwhelming
