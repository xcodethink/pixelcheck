id: 04-onboarding-destination
name: New 8-step onboarding with destination picker
priority: P1
goal: |
  Validate commit 0860359 — onboarding grew from 7 to 8 steps. Step 5
  is a new destination picker inserted between vocab-guide and date.
  Selecting a destination auto-sets the accent default for the next
  step.

  Visual + localization check:
    * 8 country tiles render. All show a flag emoji + country name in
      the correct locale (simplified zh for cn-*, English for US/UK,
      etc.).
    * Progress indicator shows 8 dots, not 7.
    * Picking CN (the user's home) — does the app handle the weird
      case where the user's "destination" is their own country? (Not
      a deal-breaker but nice to check for a confused-UX moment.)
    * Skip button jumps straight to date step without setting a
      destination — the app should fall back to the USA default
      silently per the code in trip-timeline.tsx.

applies_to:
  personas:
    - cn-chinese-free-mobile
    - us-english-free-mobile

scoring_dimensions:
  - completion
  - localization
  - visual_polish

# Note: onboarding runs once per user. These audits need a fresh
# session each run — `ai-audit` starts with a clean browser profile
# by default, so this is handled.

steps:
  - id: login-first
    type: visit
    url: https://talkbuddy.wayjet.io/auth/login
    wait_until: networkidle
    # Relies on STRIPE_E2E_TEST_EMAIL being unused for onboarding;
    # if a fresh test account doesn't exist, the scenario should
    # fall back to inspecting the onboarding UI via DevTools.

  - id: review-onboarding-trigger
    type: llm_review
    prompt: |
      This scenario requires a fresh user account. If an onboarding
      modal / full-screen overlay is NOT visible in the screenshot,
      score completion=1 and skip the rest of this scenario — we
      need ai-browser-auditor to auto-register a user first (future
      enhancement).

      If the onboarding IS visible, continue.

  - id: screenshot-step-1
    type: screenshot
    label: onboarding-step-01-welcome
    full_page: false

  - id: click-next
    type: click
    description: 'Click the "下一步" / "Next" button to advance onboarding.'

  - id: screenshot-step-2
    type: screenshot
    label: onboarding-step-02

  - id: click-next-2
    type: click
    description: 'Click Next again.'

  - id: screenshot-step-3
    type: screenshot
    label: onboarding-step-03

  - id: click-next-3
    type: click
    description: 'Click Next again.'

  - id: screenshot-step-4
    type: screenshot
    label: onboarding-step-04

  - id: click-next-4
    type: click
    description: 'Click Next again.'

  - id: screenshot-step-5-destination
    type: screenshot
    label: onboarding-step-05-destination
    full_page: true

  - id: review-destination-step
    type: llm_review
    prompt: |
      You should be looking at the destination picker (step 5 of 8).

      Verify:
        1. Heading reads "你要去哪里？" (ZH) or "Where are you going?"
           (EN). If blank or showing a key like "onboarding.step1Title"
           — that's a broken i18n lookup, score localization=1.
        2. 8 country tiles visible in a 2-column grid.
        3. Each tile shows a flag emoji + country name in the
           persona's language.
        4. Progress dots at the top show 5/8 (active) or "5 / 8".

      If fewer than 8 tiles visible OR progress shows a different
      total, flag as a regression of commit 0860359.

  - id: select-usa
    type: click
    description: 'Click the "美国" / "United States" / "🇺🇸" tile.'

  - id: click-next-5
    type: click
    description: 'Click Next to move past the destination step.'

  - id: screenshot-step-6-date
    type: screenshot
    label: onboarding-step-06-date
    full_page: true

  - id: review-date-step
    type: llm_review
    prompt: |
      Step 6 should be the departure-date picker. Expected:
        - A native <input type="date"> visible (looks like the
          OS-native date UI on $persona.device_class).
        - Label text in $persona.language.
        - Progress dots show 6/8.
        - "skip" / "暂不设置" link still available.
