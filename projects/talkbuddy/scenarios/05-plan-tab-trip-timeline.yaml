id: 05-plan-tab-trip-timeline
name: Plan Tab trip-timeline redesign
priority: P1
goal: |
  Validate commit 0860359 — Plan Tab redesigned around a trip-
  timeline with phase cards (arrival → transport → stay → dining →
  shopping → entertainment → daily-life → emergency). Each phase is
  a card with a status badge (focus / in-progress / done / pending /
  locked) and scenes inside.

  The "locked" state applies to the emergency phase when the user's
  departure date is more than 7 days out — the user can "提前练习"
  to override.

  UX-level questions:
    * Hero shows destination + countdown + progress bar?
    * Is the current phase clearly "highlighted" vs others?
    * SRS due badge ("N 个待复习") visible on relevant scenes?
    * Emergency lock-ahead persists via localStorage (re-visit page,
      is the unlock still applied)?

applies_to:
  personas:
    - cn-chinese-free-mobile
    - tw-chinese-pro-tablet
    - uk-english-power-desktop

scoring_dimensions:
  - completion
  - visual_polish
  - information_density
  - motivational_framing

steps:
  - id: login
    type: visit
    url: https://talkbuddy.wayjet.io/app
    wait_until: networkidle

  - id: screenshot-initial
    type: screenshot
    label: app-home
    full_page: true

  - id: nav-to-plan
    type: click
    description: 'Click the "计划" / "Plan" tab in the bottom
      navigation (mobile) or sidebar (desktop).'

  - id: screenshot-plan
    type: screenshot
    label: plan-tab-view
    full_page: true

  - id: review-plan-hero
    type: llm_review
    prompt: |
      Plan Tab review. If the user has already configured a
      departure date + destination, the hero should show:

        - Flag emoji + destination name (e.g. 🇺🇸 美国)
        - Countdown in red/amber/green based on urgency
        - Progress bar "旅行准备" with "X / Y 场景已掌握"
        - Streak badge (if streak > 0)

      If the user has NOT configured either, the hero should show
      the "你的旅行剧本" title and an inline setup card.

      Score:
        - completion: does the layout match one of the expected
          states above?
        - visual_polish: card corners, gradient usage on hero,
          spacing between phase cards. Any overflow on
          $persona.viewport?
        - information_density: hero shows countdown + progress +
          streak in one view. Too cluttered on mobile? Just right
          on desktop?
        - motivational_framing: does the copy push the user to
          open a scene, or does it just look like a passive
          dashboard? Flag if the mental model slips.

  - id: scroll-phases
    type: scroll
    to: "bottom"

  - id: screenshot-phases-full
    type: screenshot
    label: plan-phases-all
    full_page: true

  - id: review-phases
    type: llm_review
    prompt: |
      Count visible phase cards (should be 6-8 depending on
      destination). For each, note:
        - status badge: one of [当前重点, 进行中, 已掌握, lock-
          hint, or no badge]
        - are scenes listed inside the card (expanded) or
          collapsed?
        - any card with 0 scenes? That's a regression.

      Expected: ONE card with "当前重点" badge (focus state,
      auto-expanded). Emergency card shows lock hint if departure
      > 7 days out.

  - id: click-locked-emergency
    type: click
    description: 'Click the "紧急情况" / "Emergency" phase card — it
      should be locked if departure > 7 days.'

  - id: screenshot-unlock-ahead
    type: screenshot
    label: emergency-lock-hint
    full_page: false

  - id: click-unlock-ahead
    type: click
    description: 'Click "提前练习" / "Practice now" button if
      visible. If not, skip this step.'

  - id: screenshot-emergency-expanded
    type: screenshot
    label: emergency-expanded-after-unlock
    full_page: false

  - id: review-unlock-flow
    type: llm_review
    prompt: |
      After clicking 提前练习:
        - Did the emergency phase's scenes become visible?
        - Did the lock hint disappear or transform?
        - Reloading the page — does the unlock persist?
          (localStorage-backed per commit 0860359 phase-card.tsx
          — the audit agent doesn't need to actually reload, just
          check whether the unlock state feels "sticky".)
