project_name: TalkBuddy
base_url: https://talkbuddy.wayjet.io
admin_url: https://talkbuddy.wayjet.io/panel

# Keep concurrency low on the marketing domain so we don't get flagged
# as a bot by Google analytics / Cloud Run's ambient rate limiting.
default_concurrency: 2
default_timeout_ms: 30000

models:
  default: claude-sonnet-4-6
  critic: claude-sonnet-4-6
  computer_use: claude-opus-4-6

# Hard cap per `ai-audit run` invocation. Typical audit of 3-4
# personas × 5 scenarios × 8 checkpoints at `balanced` cost-mode
# runs about $1.20-$1.80; $3 gives headroom for retries.
budget_usd: 3.0

# Strings the auditor redacts from screenshots, HAR captures, and
# the final report. Extend this list whenever you hand the tool a
# new secret (analytics IDs, test user passwords, etc.).
redact_patterns:
  - sk-ant-
  - sk_live_
  - sk_test_
  - whsec_
  - pk_live_
  - pk_test_
  - "Bearer "
  - talkbuddy-admin-session=
  - next-auth.session-token=
  - __Secure-next-auth.session-token=

notifications:
  slack_webhook_env: SLACK_WEBHOOK
  telegram_chat_id_env: TELEGRAM_CHAT_ID

# Optional: point the auditor at the git log so the pre-run summary
# knows which commits are being validated. Matches whatever main
# currently looks like.
recent_commits_window: 30
