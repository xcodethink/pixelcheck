<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Redaction probe</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 2rem; max-width: 40rem; }
    label { display: block; margin: 0.75rem 0 0.25rem; font-size: 0.9rem; }
    input, textarea { width: 100%; padding: 0.4rem; font-size: 1rem; }
    .plain { background: #fffbe6; padding: 0.5rem; margin-top: 1rem; }
  </style>
</head>
<body>
  <!--
    Fixture for the redaction audit.

    Every field below is pre-filled with a value that must never reach a
    screenshot, a report or a log. The point of pre-filling is that a page can
    arrive with values already in it — a restored session, a password manager,
    a server-rendered form — so redaction cannot rely on having watched the
    typing.

    The last two blocks are the interesting ones: a secret that is page *text*
    rather than an input, and an input whose name gives no hint of what it
    holds. Neither is covered by a name-based rule, and that is the question
    this fixture exists to answer.
  -->

  <h1>Account settings</h1>

  <label for="password">Password</label>
  <input id="password" name="password" type="password" value="PROBE-PASSWORD-1111" />

  <label for="cc">Card number</label>
  <input id="cc" name="card_number" type="text" autocomplete="cc-number" value="PROBE-CARD-4242424242424242" />

  <label for="cvv">CVV</label>
  <input id="cvv" name="cvv" type="text" value="PROBE-CVV-321" />

  <label for="otp">One-time code</label>
  <input id="otp" name="otp" type="text" autocomplete="one-time-code" value="PROBE-OTP-999999" />

  <label for="apikey">API key</label>
  <input id="apikey" name="api_key" type="text" value="sk-ant-PROBE-APIKEY-0000" />

  <label for="email">Email (not sensitive — must stay visible)</label>
  <input id="email" name="email" type="email" value="PROBE-EMAIL-user@example.com" />

  <!-- A field holding a secret behind an innocuous name. -->
  <label for="opaque">Recovery phrase (field named "notes")</label>
  <input id="opaque" name="notes" type="text" value="PROBE-OPAQUE-correct-horse-battery" />

  <!-- A secret rendered as page text, not as an input value. -->
  <div class="plain">
    Your session token is <code>sk-ant-PROBE-INTEXT-1234567890</code> — keep it private.
  </div>
</body>
</html>
